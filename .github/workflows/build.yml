# 1.31 (.exe, stage 3): builds Fog Scout as a Windows folder app with PyInstaller (installer/fogscout.spec) on every
# pull request and push to main, runs the packaged program's self-check (FogScout.exe --selftest: modules, maps,
# models, fonts, ffmpeg, OCR, Qt) and its helper entry, and keeps the folder as a run artifact for 14 days.
# 1.32 (stage 4): compiles the installer (installer/fogscout.iss, Inno Setup – downloaded from its GitHub release,
# SHA-256 checked), installs it silently, checks tasks, shortcut and the installed .exe, uninstalls it again and keeps
# the setup as a run artifact.
# 1.33 (stage 5): on a push to main (a merge) the job "release" publishes that setup as a GitHub release – tag
# build-<run number>, the setup and its .sha256; the program's update check reads the latest one (fogscout/
# relupdate.py). Only this job may write (contents: write); pull requests never reach it. Unsigned for now.
# Actions are pinned to the full commit SHA of their tag (the tag is in the comment), as in tests.yml.
name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  exe:
    name: exe
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      shown: ${{ steps.info.outputs.shown }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # 1.38.56: the merges since BUILD_BASE give the shown build number
          filter: tree:0          # commits only – trees and files of old commits are not fetched
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Pakete (wie start.bat, nur Wheels) und PyInstaller
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --only-binary=:all: -r requirements.txt -r requirements-build.txt
          python -m pip install --only-binary=:all: --no-deps -r requirements-extra.txt
      - name: Build-Nummer für die Update-Prüfung
        id: info
        shell: pwsh
        env:
          # 1.38.56 (Saru: "Das Build soll zurück auf 1 gehen"): the shown number counts the merges to main since
          # this commit (the 1.38.55 merge = Build 0, the next one Build 1). `build` stays the run number – tags
          # build-<run number> and the update check compare it, so installed copies keep finding updates.
          BUILD_BASE: 3424fb976477405c81f9e8b5d27ed49967771dbe
        run: |
          $version = python -c "import fogscout; print(fogscout.__version__)"
          $shown = git rev-list --count --first-parent "$env:BUILD_BASE..HEAD"
          if ($LASTEXITCODE -ne 0 -or $shown -notmatch '^[0-9]{1,9}$') { throw "Build-Nummer nicht zählbar" }
          "shown=$shown" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $info = @{ build = [int]$env:GITHUB_RUN_NUMBER; shown = [int]$shown; version = $version; commit = $env:GITHUB_SHA } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText("build-info.json", $info)
          Get-Content build-info.json
      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean installer/fogscout.spec
      - name: Selbsttest der .exe
        shell: pwsh
        env:
          DBDMS_DATA_DIR: ${{ runner.temp }}\fogscout-data
        run: |
          $out = Join-Path $env:RUNNER_TEMP "selftest.json"
          $p = Start-Process -FilePath "dist\FogScout\FogScout.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out } else { Write-Output "keine Ergebnisdatei" }
          if ($p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen (Code $($p.ExitCode))" }
          # 1.35: start times of the packaged program on Windows (shown only – no limit, runners are shared)
          $st = (Get-Content $out -Raw | ConvertFrom-Json).start
          Write-Output ("Start: bis Python {0} ms, alle Module {1} ms" -f $st.python_ms, $st.modules_ms)
          # the elevated helpers are the .exe itself; without its two files a helper only prints usage (code 2)
          $h = Start-Process -FilePath "dist\FogScout\FogScout.exe" -ArgumentList "--helper", "hostsedit" -Wait -PassThru
          if ($h.ExitCode -ne 2) { throw "--helper hostsedit: Code $($h.ExitCode) statt 2" }
          $size = (Get-ChildItem -Recurse "dist\FogScout" | Measure-Object -Sum Length).Sum / 1MB
          Write-Output ("Ordnergröße: {0:N0} MB" -f $size)
          # 1.35.1: the largest files – what a smaller setup would have to start with (shown only)
          Get-ChildItem -Recurse -File "dist\FogScout" | Sort-Object Length -Descending | Select-Object -First 12 |
            ForEach-Object { Write-Output ("{0,7:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path "dist\FogScout").Path.Length + 1)) }
          foreach ($gone in "_internal\PySide6\opengl32sw.dll", "_internal\PySide6\translations") {
            if (Test-Path (Join-Path "dist\FogScout" $gone)) { throw "$gone ist noch im Ordner (installer/fogscout.spec UNUSED)" }
          }
      - name: Inno Setup (fest, Prüfsumme)
        shell: pwsh
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe
          INNO_SHA256: 8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0
        run: |
          $exe = Join-Path $env:RUNNER_TEMP "innosetup.exe"
          Invoke-WebRequest -Uri $env:INNO_URL -OutFile $exe
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($hash -ne $env:INNO_SHA256) { throw "Inno Setup: Prüfsumme $hash passt nicht" }
          $dir = Join-Path $env:RUNNER_TEMP "inno"
          $p = Start-Process -FilePath $exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/CURRENTUSER", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno Setup: Installation Code $($p.ExitCode)" }
          $iscc = Get-ChildItem -Path $dir -Recurse -Filter ISCC.exe | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe nicht gefunden" }
          "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Installer bauen
        shell: pwsh
        run: |
          $version = python -c "import fogscout; print(fogscout.__version__)"
          "FOGSCOUT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $env:ISCC "/DAppVersion=$version" installer\fogscout.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC: Code $LASTEXITCODE" }
      - name: Installer ausprobieren (still installieren, prüfen, deinstallieren)
        shell: pwsh
        env:
          DBDMS_DATA_DIR: ${{ runner.temp }}\fogscout-data
        run: |
          $setup = "dist\FogScout-Setup-$env:FOGSCOUT_VERSION.exe"
          $dir = Join-Path $env:RUNNER_TEMP "Fog Scout & Co"
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup: Code $($p.ExitCode)" }
          foreach ($f in "FogScout.exe", "unins000.exe", "_internal\maps.json", "_internal\build-info.json") {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "nach der Installation fehlt $f" }
          }
          $task = Get-ScheduledTask -TaskName "Fog Scout" -ErrorAction Stop
          if ($task.Actions[0].Execute -ne (Join-Path $dir "FogScout.exe")) { throw "Aufgabe startet $($task.Actions[0].Execute)" }
          $auto = Get-ScheduledTask -TaskName "Fog Scout (Autostart)" -ErrorAction Stop
          if ($auto.Actions[0].Arguments -ne "--tray") { throw "Autostart-Argumente: $($auto.Actions[0].Arguments)" }
          if ($task.Principal.RunLevel -ne "Highest") { throw "Aufgabe ohne höchste Rechte" }
          $lnk = Join-Path ([Environment]::GetFolderPath("Programs")) "Fog Scout.lnk"
          if (-not (Test-Path $lnk)) { throw "Startmenü-Verknüpfung fehlt" }
          $out = Join-Path $env:RUNNER_TEMP "selftest-installed.json"
          $s = Start-Process -FilePath (Join-Path $dir "FogScout.exe") -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content $out
          if ($s.ExitCode -ne 0) { throw "Selbsttest der installierten .exe: Code $($s.ExitCode)" }
          # 1.33.2: an update while Fog Scout is still closing (its mutex held) – the setup must wait, then finish
          $log = Join-Path $env:RUNNER_TEMP "setup-update.log"
          $mutex = [System.Threading.Mutex]::new($true, "Local\FogScout.SingleInstance")
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/update=1", "/LOG=`"$log`"", "/DIR=`"$dir`"" -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Setup hat nicht auf das Programmende gewartet (Code $($p.ExitCode))" }
          $mutex.ReleaseMutex(); $mutex.Dispose()
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "Update-Setup: Code $($p.ExitCode)" }
          schtasks /end /tn "Fog Scout" 2>$null | Out-Null
          Get-Process FogScout -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          $s = Start-Process -FilePath (Join-Path $dir "FogScout.exe") -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if ($s.ExitCode -ne 0) { Get-Content $out; throw "Selbsttest nach dem Update: Code $($s.ExitCode)" }
          # an update that breaks off (a program file still in use) must leave the old, working program behind
          $dll = Get-ChildItem (Join-Path $dir "_internal") -Filter "python3*.dll" | Select-Object -First 1
          $lock = [System.IO.File]::Open($dll.FullName, "Open", "Read", "None")
          $p = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/update=1", "/LOG=`"$log`"", "/DIR=`"$dir`"" -Wait -PassThru
          $lock.Close()
          Write-Output "Update mit gesperrter Datei: Code $($p.ExitCode)"
          schtasks /end /tn "Fog Scout" 2>$null | Out-Null
          Get-Process FogScout -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          foreach ($f in "FogScout.exe", "_internal\maps.json", ("_internal\" + $dll.Name)) {
            if (-not (Test-Path (Join-Path $dir $f))) { Get-Content $log -Tail 40; throw "nach dem abgebrochenen Update fehlt $f" }
          }
          $s = Start-Process -FilePath (Join-Path $dir "FogScout.exe") -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          if ($s.ExitCode -ne 0) { Get-Content $out; Get-Content $log -Tail 40; throw "Selbsttest nach abgebrochenem Update: Code $($s.ExitCode)" }
          $u = Start-Process -FilePath (Join-Path $dir "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Deinstallation: Code $($u.ExitCode)" }
          Start-Sleep -Seconds 3      # the uninstaller removes itself through a copy that ends a moment later
          if (Get-ScheduledTask -TaskName "Fog Scout" -ErrorAction SilentlyContinue) { throw "Aufgabe nach der Deinstallation noch da" }
          if (Test-Path $lnk) { throw "Verknüpfung nach der Deinstallation noch da" }
          if (Test-Path (Join-Path $dir "FogScout.exe")) { throw "FogScout.exe nach der Deinstallation noch da" }
          $size = (Get-Item $setup).Length / 1MB
          Write-Output ("Setup: {0:N0} MB" -f $size)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: FogScout-${{ github.sha }}
          path: dist/FogScout
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: FogScout-Setup-${{ github.sha }}
          path: dist/FogScout-Setup-*.exe
          retention-days: 14
          if-no-files-found: error

  release:
    name: release
    needs: exe
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # 1.33.4: HISTORY.md for the notes – only these files, no token left in the checkout
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: |
            HISTORY.md
            fogscout/__init__.py
            fogscout/whatsnew.py
            tools/release_notes.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: FogScout-Setup-${{ github.sha }}
          path: setup
      - name: GitHub-Release mit Setup, Prüfsumme und Notizen; ältere Builds weg
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          RUN: ${{ github.run_number }}
          SHOWN: ${{ needs.exe.outputs.shown }}
        run: |
          set -euo pipefail
          [[ "$SHOWN" =~ ^[0-9]{1,9}$ ]]
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG gibt es schon (erneuter Lauf)"; exit 0; fi
          # the version the newest release had ("Fog Scout 1.33.3 (Build 13)") – the notes list what came since
          prev=$(gh release view --json name -q .name 2>/dev/null | sed -n 's/^Fog Scout \([0-9][0-9.]*\) (Build [0-9]*)$/\1/p' || true)
          cd setup
          setup=$(ls FogScout-Setup-*.exe)
          [ "$(ls FogScout-Setup-*.exe | wc -l)" -eq 1 ]
          version=${setup#FogScout-Setup-}; version=${version%.exe}
          sha256sum "$setup" | awk '{print $1 "  " $2}' > "$setup.sha256"
          sum=$(cut -d' ' -f1 "$setup.sha256")
          news=$(python3 ../tools/release_notes.py ../HISTORY.md "$version" "$prev")
          {
            printf 'Fog Scout %s (Build %s), Commit %s\n\n' "$version" "$SHOWN" "$GITHUB_SHA"
            if [ -n "$news" ]; then printf '## Neu\n\n%s\n\n' "$news"; fi
            printf 'SHA-256 von %s: %s\n\n' "$setup" "$sum"
            printf 'Nicht signiert: Windows SmartScreen fragt beim ersten Start (Weitere Informationen → Trotzdem ausführen). Alle Versionen: [HISTORY.md](https://github.com/%s/blob/%s/HISTORY.md)\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } > notes.md
          gh release create "$TAG" "$setup" "$setup.sha256" --target "$GITHUB_SHA" \
            --title "Fog Scout $version (Build $SHOWN)" --notes-file notes.md --latest
          # 1.33.4 (Saru: "alte Builds entfernen"): only the newest release stays – Fog Scout only asks for it.
          # Only our own build-<N> releases and their tags, never this one; a failure here leaves the new release.
          for t in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            if [[ "$t" =~ ^build-[0-9]+$ ]] && [ "$t" != "$TAG" ]; then
              gh release delete "$t" --cleanup-tag --yes || echo "Konnte $t nicht entfernen"
            fi
          done
          # 1.33.5: tags of releases deleted by hand on the website (the website leaves the tag) go as well
          for ref in $(gh api "repos/$GH_REPO/git/matching-refs/tags/build-" -q '.[].ref'); do
            t=${ref#refs/tags/}
            if [[ "$t" =~ ^build-[0-9]+$ ]] && [ "$t" != "$TAG" ]; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$t" || echo "Konnte Tag $t nicht entfernen"
            fi
          done
